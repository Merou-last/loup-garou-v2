services:
  - type: worker
    name: arnouba-gaming-loup-garou
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DB_PATH
        value: /app/data/loup_garou.db
    disk:
      name: lg-data
      mountPath: /app/data
      sizeGB: 1
